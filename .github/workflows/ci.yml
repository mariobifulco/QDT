name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Scientific and campaign regression tests
        run: uv run python -m unittest discover -s tests -v
      - name: Validate Slurm scripts
        run: bash -n slurm/submit.sh slurm/run.sbatch slurm/collect.sbatch

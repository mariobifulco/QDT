[project]
name = "qdt"
version = "0.1.0"
description = "Reproducible quantum decision tree experiments with noisy simulation"
authors = [
    { name = "Mario Bifulco", email = "mario.bifulco@unito.it" }
]
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.1.2",
    "qiskit-aer>=0.17.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
iqm = ["iqm-client[qiskit]>=35.0.3"]

[dependency-groups]
dev = ["ruff>=0.12"]

[project.scripts]
qdt = "qdt.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4"]

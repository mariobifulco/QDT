[project]
name = "qdt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mario Bifulco", email = "mario.bifulco@unito.it" }
]
requires-python = ">=3.14"
dependencies = [
    "iqm-client[qiskit]>=35.0.3",
    "memory-profiler>=0.61.0",
    "qiskit>=2.1.2",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "tqdm>=4.67",
]

[project.scripts]
qdt = "qdt:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
